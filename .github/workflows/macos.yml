# The test suite on macOS, weekly and on demand (Actions → macOS → Run workflow). It's kept out of
# the per-push Tests workflow because GitHub's macOS machines are often all busy, and a job that
# never gets a machine would otherwise mark a push as failed.
name: macOS

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 on macos-latest
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: node --test
